<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <title>Option Pricing App</title>
  </head>
  <body class="container mt-4">
    <h1 class="mb-4">Option Pricing</h1>
    <form action="/calculate" method="post" class="mb-3">
      <div class="row g-2">
        <div class="col-md-4">
          <label class="form-label">Stock Symbol</label>
          <input class="form-control" type="text" name="symbol" value="AAPL">
        </div>
        <div class="col-md-4">
          <label class="form-label">Strike Price</label>
          <input class="form-control" type="number" step="0.01" name="strike_price" value="180">
        </div>
        <div class="col-md-4">
          <label class="form-label">Maturity (years)</label>
          <input class="form-control" type="number" step="0.1" name="maturity" value="1">
        </div>
      </div>
      <div class="row g-2 mt-2">
        <div class="col-md-4">
          <label class="form-label">Volatility (%)</label>
          <input class="form-control" type="number" step="0.1" name="volatility" value="20">
        </div>
        <div class="col-md-4">
          <label class="form-label">Risk-free Rate (%)</label>
          <input class="form-control" type="number" step="0.1" name="risk_free_rate" value="5">
        </div>
        <div class="col-md-4">
          <label class="form-label">Option Type</label>
          <select class="form-select" name="option_type">
            <option value="call">Call</option>
            <option value="put">Put</option>
          </select>
        </div>
      </div>
      <div class="row g-2 mt-2">
        <div class="col-md-4">
          <label class="form-label">Model</label>
          <select class="form-select" name="model_type">
            <option value="black_scholes">Black-Scholes</option>
            <option value="binomial_tree">Binomial Tree</option>
            <option value="monte_carlo">Monte Carlo</option>
            <option value="bjerksund_stensland">Bjerksund-Stensland</option>
          </select>
        </div>
        <div class="col-md-4">
          <label class="form-label">Steps (Binomial)</label>
          <input class="form-control" type="number" name="steps" value="100">
        </div>
        <div class="col-md-4">
          <label class="form-label">Simulations (Monte Carlo)</label>
          <input class="form-control" type="number" name="simulations" value="10000">
        </div>
      </div>
      <button class="btn btn-primary mt-3" type="submit">Calculate</button>
    </form>
    <form action="/visualize" method="post">
      {% for field in ['symbol', 'strike_price', 'maturity', 'volatility', 'risk_free_rate',
                      'option_type', 'model_type', 'steps', 'simulations'] %}
        <input type="hidden" name="{{ field }}" value="{{ request.form.get(field, '') }}">
      {% endfor %}
      <button class="btn btn-secondary" type="submit">Visualize</button>
    </form>
  </body>
</html>
